name: projekakuaponik
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  intl: ^0.20.2
  fl_chart: ^1.1.1
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  google_fonts: ^8.1.0
  shared_preferences: ^2.5.5
  firebase_messaging: ^16.3.0
  firebase_core: ^4.10.0
  flutter_local_notifications: ^19.5.0
  flutter_launcher_icons: ^0.14.4
  device_info_plus: ^12.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo_apps.png
    - assets/simple_loading_animation.json
    - assets/loading_animation.json

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo_apps.png"
